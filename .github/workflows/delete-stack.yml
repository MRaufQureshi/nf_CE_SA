name: Delete AWS Infrastructure
on: [workflow_dispatch] # Allows you to trigger the deletion manually via UI

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your region

      - name: Delete CloudFormation Stack
        run: |
          echo "Initiating stack deletion..."
          aws cloudformation delete-stack --stack-name nf-ce-sa-network-storage

          echo "Waiting for stack deletion to complete..."
          aws cloudformation wait stack-delete-complete --stack-name nf-ce-sa-network-storage
          echo "Stack successfully destroyed!"
