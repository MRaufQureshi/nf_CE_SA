name: Deploy Basic CloudFormation stack

on:
  push:
    branches:
      - "**"
    paths:
      - "aws-cfn-infra-demo/templates/**"
      - ".github/workflows/deploy-basic-infra-template.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file aws-cfn-infra-demo/templates/basic-infra-template.yaml \
            --stack-name nf-ce-sa-network-storage \
            --parameter-overrides EnvironmentName=staging ProjectName=nf-ce-sa DeployTimestamp=$(date -u +%Y%m%d%H%M%S) \
            --region us-east-1
