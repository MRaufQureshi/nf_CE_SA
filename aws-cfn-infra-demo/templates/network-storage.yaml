AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Base network and storage stack: a VPC with DNS support/hostnames enabled
  and a versioned, fully private S3 bucket.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name used for tagging (e.g. dev, staging, prod)

  ProjectName:
    Type: String
    Description: Project name used for tagging

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-vpc"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-bucket"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  VpcId:
    Description: ID of the created VPC
    Value: !Ref VPC

  BucketName:
    Description: Name of the created S3 bucket
    Value: !Ref S3Bucket
