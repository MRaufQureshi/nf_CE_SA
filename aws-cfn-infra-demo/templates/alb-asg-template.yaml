AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Application Load Balancer + Auto Scaling Group of EC2 instances running httpd.
  Imports VPC/subnets from the network stack (basic-infra-template.yaml).

Parameters:
  NetworkStackName:
    Type: String
    Description: Name of the deployed network stack to import VpcId/subnets from
    Default: nf-ce-sa-deploy-basic-infra-template

  InstanceType:
    Type: String
    Default: t3.micro

  ImageId:
    Type: String
    Description: AMI ID for the ASG instances
    Default: ami-0bd3fbcdc633a1b1a

  MinSize:
    Type: Number
    Default: 2

  MaxSize:
    Type: Number
    Default: 4

  DesiredCapacity:
    Type: Number
    Default: 2

Resources:
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from anywhere to the ALB
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: LabALBSecurityGroup

  ASGInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from the ALB only
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: LabASGInstanceSecurityGroup

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-lt"
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: !Ref ImageId
        SecurityGroupIds:
          - !Ref ASGInstanceSecurityGroup
        UserData:
          Fn::Base64: |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl enable httpd
            systemctl start httpd
            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone)
            cat > /var/www/html/index.html <<EOF
            <html>
              <body>
                <h1>Hello from instance $INSTANCE_ID</h1>
                <p>Availability Zone: $AZ</p>
              </body>
            </html>
            EOF

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !ImportValue
          Fn::Sub: "${NetworkStackName}-PublicSubnetId"
        - !ImportValue
          Fn::Sub: "${NetworkStackName}-PublicSubnet2Id"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !ImportValue
          Fn::Sub: "${NetworkStackName}-PublicSubnetId"
        - !ImportValue
          Fn::Sub: "${NetworkStackName}-PublicSubnet2Id"
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      TargetGroupARNs:
        - !Ref TargetGroup
      Tags:
        - Key: Name
          Value: LabASGInstance
          PropagateAtLaunch: true

Outputs:
  LoadBalancerDNS:
    Description: Public DNS name of the ALB - open this in a browser
    Value: !GetAtt ApplicationLoadBalancer.DNSName
